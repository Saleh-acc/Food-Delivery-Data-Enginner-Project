version: 2

models: # this block describes gold models
  - name: dim_customers # must match  .sql filename exactly
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - unique
          - not_null

  - name: dim_menu_items
    columns:
      - name: menu_item_key
        tests:
          - unique
          - not_null
      - name: restaurant_id
        tests:
          - not_null


      - name: price
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true # >= 0, if inclusive:false mean # > 0

  - name: dim_drivers
    columns: 
      - name: status
        tests: 
          - accepted_values: 
              arguments:
                values: ['offline','busy', 'available', 'inactive']
  - name: dim_restaurants
    columns:
      - name: restaurant_key
        tests:
          - unique
          - not_null
      - name: restaurant_id
        tests:
          - not_null          # NOT unique — SCD2 repeats

  - name: dim_zones
    columns:
      - name: zone_key
        tests:
          - unique
          - not_null
      - name: zone_id
        tests:
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_time
    columns:
      - name: time_key
        tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: customer_key
        tests: 
          - relationships: # test the join if the key is exist and never null
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: restaurant_key
        tests:
          - relationships:
              arguments:
                  to: ref('dim_restaurant')
                  field: restaurant_key

      - name: status
        tests:
          - accepted_values: 
              arguments:
                values: ['cancelled','delivered', 'placed', 'ready', 'preparing', 'picked_up', 'confirmed']
      - name: driver_key
        tests:
          - not_null: # the driver_key must exist in these values status
              config:
                where: "status IN ('picked_up', 'delivered')"
      # - name: pickup_zone_key
      #   tests:
      #     - not_null

      # - name: dropoff_zone_key
      #   tests:
      #     - not_null

      - name: total
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:              
                min_value: 0
                inclusive: true # >= 0, if inclusive:false mean # > 0
  - name: fact_order_items
    columns:
        - name: order_item_key
          tests:
            - unique
            - not_null
        - name: menu_item_key
          tests:
            - relationships:
                arguments:
                  to: ref('dim_menu_items')
                  field: menu_item_key
        - name: quantity
          tests:
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 0
                  inclusive: false
        - name: line_total
          tests:
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 0
                  inclusive: true
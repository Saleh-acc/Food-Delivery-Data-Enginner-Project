# nginx.conf

# How many worker processes nginx spawns. "auto" = one per CPU core.
worker_processes auto;

events {
    # How many simultaneous connections each worker handles.
    worker_connections 4096;
}

http {
        # ─── CUSTOM LOG FORMAT ─────────────────────────
    log_format upstreamlog '$time_iso8601,$msec INFO || $remote_addr -- '
                           'method=$request_method path=$request_uri '
                           'status=$status upstream=$upstream_addr '
                           'upstream_status=$upstream_status '
                           'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;
    
    
    # ─── UPSTREAMS (backend groups) ──────────────────────────────────
    
    # MinIO S3 API — port 9000 on each node
    upstream minio_s3 {
        least_conn;                # use least-connections algorithm
        server minio1:9000;
        server minio2:9000;
        server minio3:9000;
        server minio4:9000;
    }
    
    # MinIO Console — port 9001 on each node (web UI)
    upstream minio_console {
        least_conn;
        server minio1:9001;
        server minio2:9001;
        server minio3:9001;
        server minio4:9001;
    }
    
    # ─── SERVER FOR S3 API ───────────────────────────────────────────
    
    server {
        listen 9000;
        server_name _;
        
        access_log /var/log/nginx/minio_s3.log upstreamlog;


        # S3-specific tuning:
        # Don't reject requests with non-standard headers (S3 uses some).
        ignore_invalid_headers off;
        
        # Don't limit upload size. S3 supports huge multipart uploads.
        client_max_body_size 0;
        
        # Don't buffer — stream large uploads/downloads through.
        proxy_buffering off;
        proxy_request_buffering off;
        
        location / {
            proxy_pass http://minio_s3;
            
            # Forward original Host header (S3 signature uses it)
            proxy_set_header Host $http_host;
            
            # Tell backend the real client IP, not nginx's IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Use HTTP/1.1 (required for keep-alive)
            proxy_http_version 1.1;
            
            # Long timeouts for big uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            
            # Required for chunked transfer encoding
            chunked_transfer_encoding off;
        }
    }
    
    # ─── SERVER FOR CONSOLE UI ───────────────────────────────────────
    
    server {
        listen 9001;
        server_name _;
        
        access_log /var/log/nginx/minio_console.log upstreamlog;


        # Web UI needs much smaller upload limits but supports websockets
        client_max_body_size 100M;
        
        location / {
            proxy_pass http://minio_console;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (console uses it for live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
        }
    }
}
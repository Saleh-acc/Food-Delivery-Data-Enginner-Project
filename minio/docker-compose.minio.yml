# docker-compose.minio.yml

services:

  minio1: &minio
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z #quay.io/minio/aistor/minio:latest
    container_name: minio1
    hostname: minio1
    command: >
      server
      http://minio{1...4}/data
      --console-address ":9001"
    env_file:
      - .env
    volumes:
      - ./data/minio1:/data
      - ./minio-license/minio.license:/licenses/minio.lic
    networks:
      - lakehouse-core-net
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports: the nginx and minio will fight to bind to this port so we need to remove it and the nginx will handle the routing
    #   - "9000:9000"
    #   - "9001:9001"

  minio2:
    <<: *minio
    container_name: minio2
    hostname: minio2
    volumes:
      - ./data/minio2:/data  
      #- ./minio-license/minio.license:/licenses/minio.lic
    ports: []

  minio3:
    <<: *minio
    container_name: minio3
    hostname: minio3
    volumes:
      - ./data/minio3:/data
    #  - ./minio-license/minio.license:/licenses/minio.lic
    ports: []

  minio4:
    <<: *minio
    container_name: minio4
    hostname: minio4
    volumes:
      - ./data/minio4:/data
     # - ./minio-license/minio.license:/licenses/minio.lic
    ports: []

  nginx:
    image: nginx:1.27-alpine
    container_name: minio-nginx
    hostname: minio-lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lakehouse-core-net
      - spark-network
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
networks:
  lakehouse-core-net:
    external: true
  spark-network:
      external: true
    

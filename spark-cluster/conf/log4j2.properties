# ============================================================
# SPARK LOG4J2 CONFIGURATION
# Controls what Spark logs and at what verbosity
# ============================================================

rootLogger.level = WARN
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# ----------------------------
# SPARK CORE (reduce noise)
# ----------------------------
logger.spark.name = org.apache.spark
logger.spark.level = WARN

# ----------------------------
# JOB PROGRESS (keep visible)
# ----------------------------
logger.dagscheduler.name = org.apache.spark.scheduler.DAGScheduler
logger.dagscheduler.level = WARN

logger.tasksetmanager.name = org.apache.spark.scheduler.TaskSetManager
logger.tasksetmanager.level = WARN

# ----------------------------
# SERVICE STATUS LOGGING
# Shows start/stop/health of Master, Worker, History Server
# ----------------------------

# Master daemon — cluster elections, worker registrations
logger.master.name = org.apache.spark.deploy.master.Master
logger.master.level = INFO

# Worker daemon — executor launches, job assignments
logger.worker.name = org.apache.spark.deploy.worker.Worker
logger.worker.level = INFO

# History Server — log scanning, app loading
logger.history.name = org.apache.spark.deploy.history.HistoryServer
logger.history.level = WARN

# Executor lifecycle — start, register, stop
logger.executor.name = org.apache.spark.executor.Executor
logger.executor.level = WARN

# Security Manager — auth status, ACL changes
logger.security.name = org.apache.spark.SecurityManager
logger.security.level = WARN

# Standalone scheduler — resource grants, app registration
logger.standalone.name = org.apache.spark.deploy.SparkSubmit
logger.standalone.level = WARN

# ----------------------------
# NOISY EXTERNAL LIBRARIES
# ----------------------------
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = ERROR

logger.parquet.name = org.apache.parquet
logger.parquet.level = ERROR

logger.hive.name = org.apache.hive
logger.hive.level = ERROR

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = WARN

logger.netty.name = io.netty
logger.netty.level = WARN